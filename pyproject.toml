[project]
authors = [{name = "Adam Delman", email="addelman@akamai.com"}]
classifiers=[
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11"
]
dependencies = ["gitlint-core==0.19.1", "pydocstyle==6.3.0"]
description = "A pre-commit hook that lints commit messages with gitlint and custom rules"
dynamic = ["readme"]
license = "GPLv3"
name = "gitlint-commit-hook"
requires-python = ">=3.11, <4.0"
version = "v0.1.0"

[project.scripts]
gitlint-commit-hook = "gitlint_commit_hook.__main__:main"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[project.urls]
Repository = "https://github.com/adamdelman/gitlint-commit-hook"

[tool.black]
line-length = 100

[tool.cruft]
skip = [
    "gitlint_commit_hook/__init__.py",
    "README.md",
    "CHANGELOG.md",
    "vulture_allowlist.py"
]

[tool.isort]
known_first_party = "gitlint_commit_hook"
line_length = 100
skip_glob="**/__init__.py"
### for compatibility with black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = 1
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(module)s.%(funcName)s.%(lineno)d: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-v --capture=sys tests"

[tool.vulture]
exclude=[]
paths = ["gitlint_commit_hook", "vulture_allowlist.py"]

[tool.poetry]
include = ["CHANGELOG.md", "README.md"]

[tool.poetry.group.dev.dependencies]
black = "25.12.0"
dlint = "0.15.0"
flake8 = "7.3.0"
isort = "7.0.0"
mypy = "1.19.0"
pudb = ">=2025.1.5"
pynvim = ">=0.4.3, <1.0.0"
pyyaml = ">=6.0"
pytest = ">=7.1.0, <8.0.0"
pytest-cov = ">=3.0.0, <4.0.0"
pytest-xdist = ">=3.3.1"
vulture = "2.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
